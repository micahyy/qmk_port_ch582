name: Build keyboard firmware
run-name: Build keyboard firmware

on:
  push:
    branches: ["via"]
    paths:
      - 'qmk_porting/keyboards/**'
  pull_request:
    branches: ["via"]
    paths:
      - 'qmk_porting/keyboards/**'
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
      keymap:
        description: "Specified keymap"
        default: "default"
        required: true
        type: string

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all
        run: git fetch

      - name: Prepare Submodules
        run: |
          git submodule update --init --recursive || true
          
          if [ ! -d "qmk_firmware/quantum" ]; then
            echo "qmk_firmware submodule not initialized, forcing..."
            git submodule update --init --recursive qmk_firmware
          fi
          
          if [ -f "qmk_firmware/quantum/quantum.h" ]; then
            echo "✓ quantum.h found"
          else
            echo "✗ quantum.h not found"
          fi

      - name: Create minimal mbedtls headers for IAP
        run: |
          mkdir -p mcuboot/ext/mbedtls/include/mbedtls
          cat > mcuboot/ext/mbedtls/include/mbedtls/sha256.h << 'EOF'
          #ifndef MBEDTLS_SHA256_H
          #define MBEDTLS_SHA256_H
          #include <stdint.h>
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          typedef struct {
              uint32_t total[2];
              uint32_t state[8];
              unsigned char buffer[64];
          } mbedtls_sha256_context;
          void mbedtls_sha256_init(mbedtls_sha256_context *ctx);
          void mbedtls_sha256_free(mbedtls_sha256_context *ctx);
          void mbedtls_sha256_starts(mbedtls_sha256_context *ctx, int is224);
          void mbedtls_sha256_update(mbedtls_sha256_context *ctx, const unsigned char *input, size_t ilen);
          void mbedtls_sha256_finish(mbedtls_sha256_context *ctx, unsigned char output[32]);
          void mbedtls_sha256(const unsigned char *input, size_t ilen, unsigned char output[32], int is224);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Create missing wireless directories
        run: |
          mkdir -p qmk_porting/keyboards/mk01/wireless/include
          mkdir -p qmk_porting/keyboards/mk01/wireless/lib
          echo "// Placeholder" > qmk_porting/keyboards/mk01/wireless/include/wireless.h
          echo "// Placeholder" > qmk_porting/keyboards/mk01/wireless/lib/placeholder.txt

      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt

      - name: Create rgb_matrix/post_config.h
        run: |
          mkdir -p qmk_firmware/quantum/rgb_matrix
          cat > qmk_firmware/quantum/rgb_matrix/post_config.h << 'EOF'
          #pragma once
          #ifndef RGB_MATRIX_LED_COUNT
              #ifdef RGBLED_NUM
                  #define RGB_MATRIX_LED_COUNT RGBLED_NUM
              #else
                  #define RGB_MATRIX_LED_COUNT 1
              #endif
          #endif
          #ifndef RGB_MATRIX_DRIVER
              #define RGB_MATRIX_DRIVER WS2812
          #endif
          EOF

      - name: Add official startup file to build
        run: |
          # 复制官方启动文件到 platform 目录
          cp sdk/Startup/startup_CH583.S qmk_porting/platforms/ch58x/startup_CH583.S
          # 添加到 CMake 源文件列表
          echo "target_sources(mk01.elf PRIVATE qmk_porting/platforms/ch58x/startup_CH583.S)" >> CMakeLists.txt
          echo "Official startup file added"

      - name: Configure CMake
        run: |
          cmake --no-warn-unused-cli \
            -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE \
            -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} \
            -Dkeyboard:STRING=${{inputs.keyboard}} \
            -Dkeymap:STRING=${{inputs.keymap}} \
            -S${{github.workspace}} -B${{github.workspace}}/build

      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target mk01.elf || true

      - name: Upload ELF firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.keyboard}}.elf
          path: build/mk01.elf

      - name: Get git version
        run: echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV
