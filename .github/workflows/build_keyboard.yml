name: Build keyboard firmware
run-name: Build keyboard firmware

on:
  push:
    branches: ["via"]
  pull_request:
    branches: ["via"]
  # # Allows you to run this workflow manually from the Actions tab or through HTTP API
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
      keymap:
        description: "Specified keymap"
        default: "default"
        required: true
        type: string

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all
        run: git fetch

      - name: Prepare Submodules
        run: |
          # 初始化所有子模块，忽略 keyboards_private 的错误
          git submodule update --init --recursive || true
          
          # 确保 qmk_firmware 子模块被正确拉取
          if [ ! -d "qmk_firmware/quantum" ]; then
            echo "qmk_firmware submodule not initialized, forcing..."
            git submodule update --init --recursive qmk_firmware
          fi
          
          # 验证 quantum.h 是否存在
          if [ -f "qmk_firmware/quantum/quantum.h" ]; then
            echo "✓ quantum.h found"
          else
            echo "✗ quantum.h not found, checking directory..."
            ls -la qmk_firmware/ || echo "qmk_firmware directory empty"
            ls -la qmk_firmware/quantum/ 2>/dev/null || echo "quantum directory not found"
          fi
      - name: Create minimal mbedtls headers for IAP
        run: |
          mkdir -p mcuboot/ext/mbedtls/include/mbedtls
          cat > mcuboot/ext/mbedtls/include/mbedtls/sha256.h << 'EOF'
          #ifndef MBEDTLS_SHA256_H
          #define MBEDTLS_SHA256_H

          #include <stdint.h>
          #include <stddef.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          typedef struct {
              uint32_t total[2];
              uint32_t state[8];
              unsigned char buffer[64];
          } mbedtls_sha256_context;

          void mbedtls_sha256_init(mbedtls_sha256_context *ctx);
          void mbedtls_sha256_free(mbedtls_sha256_context *ctx);
          void mbedtls_sha256_starts(mbedtls_sha256_context *ctx, int is224);
          void mbedtls_sha256_update(mbedtls_sha256_context *ctx, const unsigned char *input, size_t ilen);
          void mbedtls_sha256_finish(mbedtls_sha256_context *ctx, unsigned char output[32]);
          void mbedtls_sha256(const unsigned char *input, size_t ilen, unsigned char output[32], int is224);

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF
          echo "mbedtls/sha256.h created"

      - name: Ensure mbedtls
        run: |
          if [ ! -f "mcuboot/ext/mbedtls/include/mbedtls/sha256.h" ]; then
            echo "mbedtls missing, cloning..."
            cd mcuboot/ext
            git clone --depth 1 --branch v2.28.8 https://github.com/Mbed-TLS/mbedtls.git
            cd ../..
          fi
          ls -la mcuboot/ext/mbedtls/include/mbedtls/sha256.h

      - name: Create missing wireless directories
        run: |
          mkdir -p qmk_porting/keyboards/mk01/wireless/include
          mkdir -p qmk_porting/keyboards/mk01/wireless/lib
          echo "// Placeholder" > qmk_porting/keyboards/mk01/wireless/include/wireless.h
          echo "// Placeholder" > qmk_porting/keyboards/mk01/wireless/lib/placeholder.txt

      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt

      - name: Debug - Find quantum.h
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Directory structure ==="
          ls -la
          echo "=== Looking for quantum.h ==="
          find . -name "quantum.h" -type f 2>/dev/null
          echo "=== Checking qmk_firmware/quantum/ ==="
          ls -la qmk_firmware/quantum/ 2>/dev/null | head -20 || echo "qmk_firmware/quantum/ not found"
          echo "=== Checking qmk_firmware root ==="
          ls -la qmk_firmware/ | head -20


      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake --no-warn-unused-cli -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} -Dkeyboard:STRING=${{inputs.keyboard}} -Dkeymap:STRING=${{inputs.keymap}} -S${{github.workspace}} -B${{github.workspace}}/build

      - name: Build
        # Build your program with the given configuration
        run: |
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target all -- || true
      - name: Check generated files
        run: |
          echo "=== Checking for generated files ==="
          ls -la build/*.elf 2>/dev/null || echo "No .elf files"
          ls -la *.hex 2>/dev/null || echo "No .hex files"
          ls -la *.uf2 2>/dev/null || echo "No .uf2 files"
          echo "=== Build directory contents ==="
          ls -la build/

      - name: Check generated files
        run: |
          echo "=== Build directory ==="
          ls -la build/
          echo "=== Looking for .hex files ==="
          find . -name "*.hex" -type f
          echo "=== Looking for .uf2 files ==="
          find . -name "*.uf2" -type f
          echo "=== Looking for .elf files ==="
          find . -name "*.elf" -type f

      - name: Get git version
        run: echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV

      - name: UF2 Firmware (${{inputs.keyboard}})
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.keyboard}}.uf2
          path: ${{inputs.keyboard}}_upgrade_${{ env.git_ver }}.uf2

      - name: Hex Firmware (${{inputs.keyboard}})
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.keyboard}}.hex
          path: ${{inputs.keyboard}}_factory_${{ env.git_ver }}.hex

      # - name: Test
      #   working-directory: ${{github.workspace}}/build
      #   # Execute tests defined by the CMake configuration.
      #   # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      #   run: ctest -C ${{env.BUILD_TYPE}}
