name: Build keyboard firmware
run-name: Build keyboard firmware

on:
  push:
    branches: ["via"]
    paths:
      - 'qmk_porting/keyboards/**'
  pull_request:
    branches: ["via"]
    paths:
      - 'qmk_porting/keyboards/**'
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
      keymap:
        description: "Specified keymap"
        default: "default"
        required: true
        type: string

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all
        run: git fetch

      - name: Prepare Submodules
        run: |
          git submodule update --init --recursive || true
          
          if [ ! -d "qmk_firmware/quantum" ]; then
            echo "qmk_firmware submodule not initialized, forcing..."
            git submodule update --init --recursive qmk_firmware
          fi
          
          if [ -f "qmk_firmware/quantum/quantum.h" ]; then
            echo "✓ quantum.h found"
          else
            echo "✗ quantum.h not found"
          fi

      - name: Create minimal mbedtls headers for IAP
        run: |
          mkdir -p mcuboot/ext/mbedtls/include/mbedtls
          cat > mcuboot/ext/mbedtls/include/mbedtls/sha256.h << 'EOF'
          #ifndef MBEDTLS_SHA256_H
          #define MBEDTLS_SHA256_H
          #include <stdint.h>
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          typedef struct {
              uint32_t total[2];
              uint32_t state[8];
              unsigned char buffer[64];
          } mbedtls_sha256_context;
          void mbedtls_sha256_init(mbedtls_sha256_context *ctx);
          void mbedtls_sha256_free(mbedtls_sha256_context *ctx);
          void mbedtls_sha256_starts(mbedtls_sha256_context *ctx, int is224);
          void mbedtls_sha256_update(mbedtls_sha256_context *ctx, const unsigned char *input, size_t ilen);
          void mbedtls_sha256_finish(mbedtls_sha256_context *ctx, unsigned char output[32]);
          void mbedtls_sha256(const unsigned char *input, size_t ilen, unsigned char output[32], int is224);
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

      - name: Create missing wireless directories
        run: |
          mkdir -p qmk_porting/keyboards/mk01/wireless/include
          mkdir -p qmk_porting/keyboards/mk01/wireless/lib
          echo "// Placeholder" > qmk_porting/keyboards/mk01/wireless/include/wireless.h
          echo "// Placeholder" > qmk_porting/keyboards/mk01/wireless/lib/placeholder.txt

      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt

      - name: Create rgb_matrix/post_config.h
        run: |
          mkdir -p qmk_firmware/quantum/rgb_matrix
          cat > qmk_firmware/quantum/rgb_matrix/post_config.h << 'EOF'
          #pragma once
          #ifndef RGB_MATRIX_LED_COUNT
              #ifdef RGBLED_NUM
                  #define RGB_MATRIX_LED_COUNT RGBLED_NUM
              #else
                  #define RGB_MATRIX_LED_COUNT 1
              #endif
          #endif
          #ifndef RGB_MATRIX_DRIVER
              #define RGB_MATRIX_DRIVER WS2812
          #endif
          EOF

      - name: Add official startup file to build
        run: |
          cp sdk/Startup/startup_CH583.S qmk_porting/platforms/ch58x/startup_CH583.S
          echo "target_sources(mk01.elf PRIVATE qmk_porting/platforms/ch58x/startup_CH583.S)" >> CMakeLists.txt
          echo "Official startup file added"

      - name: Create missing function implementations
        run: |
          cat > qmk_porting/platforms/ch58x/missing_functions.c << 'EOF'
          #include <stdint.h>
          #include <stdbool.h>
          
          // ========== 延时函数 ==========
          void mDelayuS(uint32_t us) {
              volatile uint32_t i;
              for (i = 0; i < us * 10; i++) {
                  __asm__ volatile ("nop");
              }
          }
          
          void mDelaymS(uint32_t ms) {
              for (uint32_t i = 0; i < ms; i++) {
                  mDelayuS(1000);
              }
          }
          
          // ========== EEPROM/NVM 函数 ==========
          bool nvm_eeconfig_is_enabled(void) { return true; }
          uint32_t nvm_eeconfig_read_debug(void) { return 0; }
          uint32_t nvm_eeconfig_read_default_layer(void) { return 0; }
          uint32_t nvm_eeconfig_read_keymap(void) { return 0; }
          void nvm_eeconfig_update_keymap(uint32_t data) { (void)data; }
          uint32_t nvm_eeconfig_read_rgb_matrix(void) { return 0; }
          void nvm_eeconfig_update_rgb_matrix(uint32_t data) { (void)data; }
          void nvm_eeconfig_update_handedness(bool handedness) { (void)handedness; }
          
          // ========== VIA 函数 ==========
          bool nvm_via_read_magic(void) { return true; }
          void nvm_via_erase(void) {}
          void nvm_via_update_magic(void) {}
          void nvm_via_update_layout_options(void) {}
          void nvm_via_read_layout_options(void) {}
          
          // ========== QMK 处理函数 ==========
          void process_underglow(void) {}
          void process_default_layer(void) {}
          void process_oneshot(void) {}
          void process_quantum(void) {}
          
          // ========== 唤醒相关函数 ==========
          void wakeup_matrix_handle_key_event(uint8_t row, uint8_t col, bool pressed) { (void)row; (void)col; (void)pressed; }
          bool keypress_is_wakeup_key(uint8_t row, uint8_t col) { (void)row; (void)col; return false; }
          EOF
          echo "target_sources(mk01.elf PRIVATE qmk_porting/platforms/ch58x/missing_functions.c)" >> CMakeLists.txt
          echo "Missing functions added"

      - name: Configure CMake
        run: |
          cmake --no-warn-unused-cli \
            -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE \
            -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} \
            -Dkeyboard:STRING=${{inputs.keyboard}} \
            -Dkeymap:STRING=${{inputs.keymap}} \
            -S${{github.workspace}} -B${{github.workspace}}/build

      - name: Build
        run: |
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target mk01.elf || true

      - name: Generate UF2 and HEX
        run: |
          TOOLCHAIN_BIN="${{github.workspace}}/utils/Linux/riscv-none-elf-gcc/bin"
          
          # 生成 hex 文件
          $TOOLCHAIN_BIN/riscv-none-elf-objcopy -Oihex build/mk01.elf mk01.hex
          
          # 生成 uf2 文件（使用 CH582 的 family ID）
          python3 utils/uf2conv.py mk01.hex -c -f 0x1aa143c7 -o mk01.uf2
          
          echo "Generated files:"
          ls -la mk01.hex mk01.uf2

      - name: Upload UF2 firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.keyboard}}.uf2
          path: mk01.uf2

      - name: Upload HEX firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.keyboard}}.hex
          path: mk01.hex

      - name: Upload ELF firmware (backup)
        uses: actions/upload-artifact@v4
        with:
          name: ${{inputs.keyboard}}.elf
          path: build/mk01.elf

      - name: Get git version
        run: echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV
